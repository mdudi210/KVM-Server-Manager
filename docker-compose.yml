services:
  mysql:
    image: mysql:8.0
    container_name: kvm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-kvm_db}
      MYSQL_USER: ${DB_USER:-kvm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kvm_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - kvm-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kvm-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-kvm_user}
      DB_PASSWORD: ${DB_PASSWORD:-kvm_password}
      DB_DATABASE: ${DB_DATABASE:-kvm_db}
      AUTHJWT_SECRET_KEY: ${AUTHJWT_SECRET_KEY:-change-this-secret}
      ALGORITHM: ${ALGORITHM:-HS256}
      SSH_HOSTNAME: ${SSH_HOSTNAME:-host.docker.internal}
      SSH_USERNAME: ${SSH_USERNAME:-root}
      SSH_PASSWORD: ${SSH_PASSWORD:-changeme}
      LINUX_TEMPLATE: ${LINUX_TEMPLATE:-linux-template}
      WIN_TEMPLATE: ${WIN_TEMPLATE:-windows-template}
      LINUX_ISO: ${LINUX_ISO:-/home/linux.iso}
      WIN_ISO: ${WIN_ISO:-/home/windows.iso}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kvm-network
    command: >
      sh -c "python backend/db_setup.py && uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kvm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VUE_APP_API_URL=http://nginx
    networks:
      - kvm-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: kvm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - kvm-network

networks:
  kvm-network:
    driver: bridge

volumes:
  mysql_data:
